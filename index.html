<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Mobile Core</title>
    <style>
        body { background: #0a0f1d; color: #00f3ff; font-family: monospace; text-align: center; padding: 20px; }
        .arc-reactor { width: 130px; height: 130px; border-radius: 50%; border: 4px solid #00f3ff; margin: 30px auto; box-shadow: 0 0 25px #00f3ff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-shadow: 0 0 5px #00f3ff; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .listening { box-shadow: 0 0 40px #ff0055; border-color: #ff0055; color: #ff0055; }
        .speaking { box-shadow: 0 0 40px #00ff66; border-color: #00ff66; color: #00ff66; }
        #status { font-size: 1.1em; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;}
        #response { background: rgba(0, 243, 255, 0.05); padding: 15px; border-radius: 8px; max-width: 550px; margin: 20px auto; text-align: left; border: 1px solid #00f3ff; line-height: 1.6; display: none; }
        .input-container { margin: 20px auto; max-width: 500px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #111a30; border: 1px solid #00f3ff; padding: 12px; color: #00f3ff; border-radius: 5px; font-family: monospace; outline: none; }
        button { background: #00f3ff; color: #0a0f1d; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>

    <h1>JARVIS CLOUD TERMINAL</h1>
    <p>Operator: Mr. Jd Mode</p>

    <div class="arc-reactor" id="reactor">TAP TO WAKE</div>
    <div id="status">OFFLINE</div>

    <div class="input-container">
        <input type="text" id="textInput" placeholder="Type a command to Mr. Jd's Core...">
        <button id="sendBtn">SEND</button>
    </div>

    <div id="response"></div>

    <script>
        const API_URL = window.location.origin;
        const reactor = document.getElementById('reactor');
        const statusDiv = document.getElementById('status');
        const responseDiv = document.getElementById('response');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        
        if (recognition) {
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-US';
        }

        let activeAmbient = false;
        let isSpeaking = false;
        let micTimeout;

        function startListeningLoop() {
            if (!activeAmbient || isSpeaking || !recognition) return;
            try { 
                recognition.start(); 
            } catch(e) {
                try { recognition.stop(); } catch(err){}
            }
        }

        function jarvisSpeak(text) {
            isSpeaking = true;
            if (recognition) recognition.stop(); 
            clearTimeout(micTimeout);
            
            reactor.className = "arc-reactor speaking";
            reactor.innerText = "SPEAKING";
            statusDiv.innerText = "Responding...";

            let cleanText = text.replace(/[*#_`\-]/g, ' ');
            window.speechSynthesis.cancel(); 
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            utterance.onend = () => {
                isSpeaking = false;
                if(activeAmbient) {
                    reactor.className = "arc-reactor listening";
                    reactor.innerText = "LISTENING";
                    statusDiv.innerText = "Listening, Mr. Jd...";
                    startListeningLoop();
                } else {
                    reactor.className = "arc-reactor";
                    reactor.innerText = "TAP TO WAKE";
                    statusDiv.innerText = "STANDBY";
                }
            };
            
            utterance.onerror = () => {
                isSpeaking = false;
                if(activeAmbient) startListeningLoop();
            };

            window.speechSynthesis.speak(utterance);
        }

        if (recognition) {
            recognition.onstart = () => {
                clearTimeout(micTimeout);
                reactor.className = "arc-reactor listening";
                reactor.innerText = "LISTENING";
                statusDiv.innerText = "Live Mic: Talk naturally...";
                
                micTimeout = setTimeout(() => {
                    try { recognition.stop(); } catch(e){}
                }, 6000);
            };

            recognition.onresult = async (event) => {
                clearTimeout(micTimeout);
                const transcript = event.results[0][0].transcript.trim();
                if(!transcript) return;
                executeCommand(transcript);
            };

            recognition.onerror = (e) => { 
                clearTimeout(micTimeout);
                if (e.error === 'not-allowed') {
                    statusDiv.innerText = "Mic restricted. Keyboard Override active.";
                }
            };

            recognition.onend = () => { 
                clearTimeout(micTimeout);
                if(activeAmbient && !isSpeaking) {
                    setTimeout(startListeningLoop, 400); 
                }
            };
        } else {
            statusDiv.innerText = "Voice engine restricted. Keyboard Mode live.";
        }

        async function executeCommand(messageText) {
            if (!messageText) return;

            if (["shut up", "shutup", "stop speaking", "stop talking", "quiet"].some(word => messageText.toLowerCase().includes(word))) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                reactor.className = "arc-reactor";
                reactor.innerText = "TAP TO WAKE";
                statusDiv.innerText = "Stopped. Standing by, Sir...";
                return;
            }

            statusDiv.innerText = "Thinking...";
            reactor.innerText = "THINKING";

            try {
                const res = await fetch(`${API_URL}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await res.json();
                
                responseDiv.style.display = "block";
                responseDiv.innerText = data.reply;
                
                jarvisSpeak(data.reply);
            } catch (err) {
                statusDiv.innerText = "Connection error.";
                isSpeaking = false;
            }
        }

        // Send Button Trigger
        sendBtn.onclick = () => {
            const txt = textInput.value.trim();
            if(txt) {
                // Unlock audio track context
                let trigger = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(trigger);
                
                executeCommand(txt);
                textInput.value = "";
            }
        };

        // Enter key trigger
        textInput.addEventListener("keyup", (event) => {
            if (event.key === "Enter") {
                sendBtn.click();
            }
        });

        reactor.onclick = () => {
            window.speechSynthesis.cancel();
            let trigger = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(trigger);
            
            if (activeAmbient) {
                activeAmbient = false;
                isSpeaking = false;
                reactor.className = "arc-reactor";
                reactor.innerText = "TAP TO WAKE";
                statusDiv.innerText = "OFFLINE";
            } else {
                activeAmbient = true;
                isSpeaking = false;
                statusDiv.innerText = "Connecting...";
                if(recognition) {
                    startListeningLoop();
                } else {
                    statusDiv.innerText = "Keyboard control online.";
                }
            }
        };
    </script>
</body>
</html>
