<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Mobile Core</title>
    <style>
        body { background: #0a0f1d; color: #00f3ff; font-family: monospace; text-align: center; padding: 20px; }
        .arc-reactor { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #00f3ff; margin: 40px auto; box-shadow: 0 0 25px #00f3ff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-shadow: 0 0 5px #00f3ff; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .listening { box-shadow: 0 0 40px #ff0055; border-color: #ff0055; color: #ff0055; }
        .speaking { box-shadow: 0 0 40px #00ff66; border-color: #00ff66; color: #00ff66; }
        #status { font-size: 1.2em; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;}
        #response { background: rgba(0, 243, 255, 0.05); padding: 15px; border-radius: 8px; max-width: 550px; margin: 20px auto; text-align: left; border: 1px solid #00f3ff; line-height: 1.6; display: none; }
    </style>
</head>
<body>

    <h1>JARVIS CLOUD TERMINAL</h1>
    <p>Operator: Mr. Jd Mode</p>

    <div class="arc-reactor" id="reactor">TAP TO WAKE</div>
    <div id="status">OFFLINE</div>
    <div id="response"></div>

    <script>
        const API_URL = window.location.origin;
        const reactor = document.getElementById('reactor');
        const statusDiv = document.getElementById('status');
        const responseDiv = document.getElementById('response');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = new SpeechRecognition();
        
        recognition.continuous = false; 
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        let activeAmbient = false;
        let isSpeaking = false;
        let micTimeout;

        function startListeningLoop() {
            if (!activeAmbient || isSpeaking) return;
            try { 
                recognition.start(); 
            } catch(e) {
                // If already running, clear any stuck states
                try { recognition.stop(); } catch(err){}
            }
        }

        function jarvisSpeak(text) {
            isSpeaking = true;
            recognition.stop(); 
            clearTimeout(micTimeout);
            
            reactor.className = "arc-reactor speaking";
            reactor.innerText = "SPEAKING";
            statusDiv.innerText = "Responding...";

            let cleanText = text.replace(/[*#_`\-]/g, ' ');
            window.speechSynthesis.cancel(); 
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            utterance.onend = () => {
                isSpeaking = false;
                if(activeAmbient) {
                    reactor.className = "arc-reactor listening";
                    reactor.innerText = "LISTENING";
                    statusDiv.innerText = "Listening, Mr. Jd...";
                    startListeningLoop();
                }
            };
            
            utterance.onerror = () => {
                isSpeaking = false;
                if(activeAmbient) startListeningLoop();
            };

            window.speechSynthesis.speak(utterance);
        }

        recognition.onstart = () => {
            clearTimeout(micTimeout);
            reactor.className = "arc-reactor listening";
            reactor.innerText = "LISTENING";
            statusDiv.innerText = "Live Mic: Talk naturally...";
            
            // 7-second max limit fallback to force submission if browser hangs
            micTimeout = setTimeout(() => {
                try { recognition.stop(); } catch(e){}
            }, 7000);
        };

        recognition.onresult = async (event) => {
            clearTimeout(micTimeout);
            const transcript = event.results[0][0].transcript.trim();
            if(!transcript) return;

            // INSTANT VOCAL INTERRUPT SHUTUP HANDLER
            if (["shut up", "shutup", "stop speaking", "stop talking", "quiet"].some(word => transcript.toLowerCase().includes(word))) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                reactor.className = "arc-reactor listening";
                reactor.innerText = "LISTENING";
                statusDiv.innerText = "Stopped. Standing by, Sir...";
                setTimeout(startListeningLoop, 300);
                return;
            }

            statusDiv.innerText = "Thinking...";
            reactor.innerText = "THINKING";

            try {
                const res = await fetch(`${API_URL}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: transcript })
                });
                const data = await res.json();
                
                responseDiv.style.display = "block";
                responseDiv.innerText = data.reply;
                
                jarvisSpeak(data.reply);
            } catch (err) {
                statusDiv.innerText = "Core Timeout. Retrying...";
                isSpeaking = false;
                setTimeout(startListeningLoop, 1000);
            }
        };

        recognition.onerror = (e) => { 
            clearTimeout(micTimeout);
            if (e.error === 'not-allowed') {
                statusDiv.innerText = "MIC BLOCKED BY BROWSER Settings";
                activeAmbient = false;
                reactor.innerText = "ERROR";
            }
        };

        recognition.onend = () => { 
            clearTimeout(micTimeout);
            if(activeAmbient && !isSpeaking) {
                setTimeout(startListeningLoop, 400); 
            }
        };

        // Complete unlock sequence for both Laptop and Poco Mobile browser engines
        reactor.onclick = () => {
            window.speechSynthesis.cancel();
            
            // Unlocks audio context restrictions
            let trigger = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(trigger);
            
            if (activeAmbient) {
                // If clicked while active, acts as a physical manual shutup button
                activeAmbient = false;
                isSpeaking = false;
                reactor.className = "arc-reactor";
                reactor.innerText = "TAP TO WAKE";
                statusDiv.innerText = "OFFLINE";
            } else {
                activeAmbient = true;
                isSpeaking = false;
                statusDiv.innerText = "Connecting to Core...";
                startListeningLoop();
            }
        };
    </script>
</body>
</html>
